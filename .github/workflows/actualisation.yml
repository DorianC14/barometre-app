name: Actualisation des données

# Les cours de marché (toutes les 15 minutes) sont gérés par marches.yml.
# Heures en UTC (Paris = UTC+1 en hiver, UTC+2 en été).
# Revue de presse : 4 éditions par jour, week-end compris (8 h 30, 9 h 30, 17 h, 21 h, heure de Paris).
# GitHub lance souvent les tâches programmées avec 5 à 15 minutes de retard : elles partent donc
# 20 minutes avant l'heure prévue, et en double (heure d'hiver / heure d'été). Le script choisit
# l'édition la plus proche de l'heure de Paris et ignore un lancement si l'édition est déjà publiée.
on:
  schedule:
    - cron: "7 4 * * *"            # collecte complète (macro, taux, crédit…) : chaque jour vers 5 h-6 h
    - cron: "10 6,7,8 * * *"       # revue de presse de 8 h 30 et de 9 h 30
    - cron: "40 14,15,18,19 * * *" # revue de presse de 17 h et de 21 h
  workflow_dispatch:
    inputs:
      mode:
        description: "Type de mise à jour"
        type: choice
        options: [full, markets, news]
        default: full

concurrency:
  group: actualisation-donnees
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Installer les dépendances
        run: pip install -r pipeline/requirements.txt

      - name: Choisir le type de mise à jour
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "10 6,7,8 * * *"|"40 14,15,18,19 * * *") m=news ;;
            "") m="${{ inputs.mode || 'full' }}" ;;
            *) m=full ;;
          esac
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "Mode : $m"

      - name: Collecter, recalculer et publier
        env:
          # Clé gratuite Twelve Data (Settings → Secrets and variables → Actions)
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          git config --global user.name "barometre-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/maj.sh ${{ steps.mode.outputs.mode }}

  tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt && python -m pytest -q pipeline/tests
